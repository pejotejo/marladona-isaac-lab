[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marladona-mjlab"
version = "1.0.0"
description = "MARLadona multi-agent soccer and PPO training on mjlab / MuJoCo-Warp"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "mjlab>=1.6.0,<1.7",
    "gymnasium>=1.0",
    "GitPython>=3.1.30",
]

[project.optional-dependencies]
analysis = ["pyqtgraph>=0.13", "PyQt5>=5.15", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.9"]
assets = ["usd-core>=25"]

[tool.setuptools.packages.find]
where = ["source/mjlab_marl", "source/rsl_marl"]
include = ["mjlab_marl*", "rsl_marl*"]

[tool.setuptools.package-data]
mjlab_marl = ["assets/mjcf/*.xml", "assets/mjcf/*.obj"]

[tool.pytest.ini_options]
testpaths = ["tests", "source/rsl_marl/tests"]
markers = ["simulation: exercises the actual mjlab / MuJoCo-Warp simulator"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.isort]

atomic = true
profile = "black"
line_length = 120
py_version = 310
skip_glob = ["docs/*", "logs/*"]
group_by_package = true

sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "ISAACLABPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
extra_standard_library = [
    "numpy",
    "h5py",
    "open3d",
    "torch",
    "tensordict",
    "bpy",
    "matplotlib",
    "gymnasium",
    "gym",
    "scipy",
    "hid",
    "yaml",
    "prettytable",
    "toml",
    "trimesh",
    "tqdm",
    "psutil",
]
known_thirdparty = [
    "isaacsim.core.api",
    "omni.replicator.core",
    "pxr",
    "omni.kit.*",
    "warp",
    "carb",
    "Semantics",
]
known_isaaclabparty = [
    "isaaclab",
    "isaaclab_tasks",
    "isaaclab_assets",
    "isaaclab_mimic",
    "isaaclab_rl"
]

# Modify the following to include the package names of your first-party code
known_firstparty = ["mjlab_marl", "rsl_marl"]
known_local_folder = "config"

[tool.pyright]

exclude = [
    "**/__pycache__",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]

typeCheckingMode = "basic"
pythonVersion = "3.10"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

# This is required as the CI pre-commit does not download the module (i.e. numpy, torch, prettytable)
# Therefore, we have to ignore missing imports
reportMissingImports = "none"
# This is required to ignore for type checks of modules with stubs missing.
reportMissingModuleSource = "none" # -> most common: prettytable in mdp managers

reportGeneralTypeIssues = "none"       # -> raises 218 errors (usage of literal MISSING in dataclasses)
reportOptionalMemberAccess = "warning" # -> raises 8 errors
reportPrivateUsage = "warning"
