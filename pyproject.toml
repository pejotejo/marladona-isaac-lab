[project]
name = "marladona-isaac-lab"
version = "0.1.0"
description = "MARLadona soccer training with Isaac Lab 3.0 and Isaac Sim 6.2."
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab[isaacsim]==3.0.0",
    "isaaclab-marl",
    "rsl-marl",
    "toml>=0.10.2",
]

[project.optional-dependencies]
video = ["isaaclab[video]==3.0.0"]
viser = ["isaaclab[viser]==3.0.0"]
wandb = ["isaaclab[wandb]==3.0.0"]

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4", "ruff>=0.17.3"]

[tool.uv]
package = false
required-version = ">=0.12.24"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Match Isaac Lab's resolution across NVIDIA's index and PyPI.
index-strategy = "unsafe-best-match"
# Compatibility overrides from Isaac Lab v3.0.0; dependency uv settings do not propagate.
# https://github.com/isaac-sim/IsaacLab/blob/v3.0.0/pyproject.toml
override-dependencies = [
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "urllib3>=2.8.0",
]

[tool.uv.sources]
isaaclab = { index = "pypi-public" }
isaaclab-marl = { path = "source/isaaclab_marl", editable = true }
rsl-marl = { path = "source/rsl_marl", editable = true }
omniverseclient = { index = "pypi-public" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.isort]

atomic = true
profile = "black"
line_length = 120
py_version = 312
skip_glob = ["docs/*", "logs/*"]
group_by_package = true

sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "ISAACLABPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
extra_standard_library = [
    "numpy",
    "h5py",
    "open3d",
    "torch",
    "tensordict",
    "bpy",
    "matplotlib",
    "gymnasium",
    "gym",
    "scipy",
    "hid",
    "yaml",
    "prettytable",
    "toml",
    "trimesh",
    "tqdm",
    "psutil",
]
known_thirdparty = [
    "isaacsim.core.api",
    "omni.replicator.core",
    "pxr",
    "omni.kit.*",
    "warp",
    "carb",
    "Semantics",
]
known_isaaclabparty = [
    "isaaclab",
    "isaaclab_tasks",
    "isaaclab_assets",
    "isaaclab_mimic",
    "isaaclab_rl",
]

# Modify the following to include the package names of your first-party code
known_firstparty = "isaaclab_marl"
known_local_folder = "config"

[tool.pyright]

exclude = ["**/__pycache__", "**/docs", "**/logs", ".git", ".vscode"]

typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

# This is required as the CI pre-commit does not download the module (i.e. numpy, torch, prettytable)
# Therefore, we have to ignore missing imports
reportMissingImports = "none"
# This is required to ignore for type checks of modules with stubs missing.
reportMissingModuleSource = "none" # -> most common: prettytable in mdp managers

reportGeneralTypeIssues = "none"       # -> raises 218 errors (usage of literal MISSING in dataclasses)
reportOptionalMemberAccess = "warning" # -> raises 8 errors
reportPrivateUsage = "warning"
